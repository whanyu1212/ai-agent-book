name: provider adoption tests

# Chapters 1, 2, 3, and 4 resolve endpoints, credentials and model ids through
# agentbook.providers rather than through per-experiment copies of the old
# openrouter_fallback.py. That makes a change to agentbook/ able to break
# several experiments at once, in code paths none of their own tests would flag as
# related -- so the shared package is a trigger here.

on:
  pull_request:
    paths:
      - "agentbook/**"
      - "chapter2/context-compression/**"
      - "chapter2/kv-cache/**"
      - "chapter2/prompt-injection/**"
      - "chapter2/system-hint/**"
      - "chapter1/learning-from-experience/**"
      - "chapter3/agentic-rag/**"
      - "chapter3/agentic-rag-for-user-memory/**"
      - "chapter3/contextual-retrieval/**"
      - "chapter3/log-sanitization/**"
      - "chapter3/memobase/**"
      - "chapter4/active-tool-discovery/**"
      - "pyproject.toml"
      - ".github/workflows/provider-adoption-tests.yml"
  push:
    branches: [main]
    paths:
      - "agentbook/**"
      - "chapter2/context-compression/**"
      - "chapter2/kv-cache/**"
      - "chapter2/prompt-injection/**"
      - "chapter2/system-hint/**"
      - "chapter1/learning-from-experience/**"
      - "chapter3/agentic-rag/**"
      - "chapter3/agentic-rag-for-user-memory/**"
      - "chapter3/contextual-retrieval/**"
      - "chapter3/log-sanitization/**"
      - "chapter3/memobase/**"
      - "chapter4/active-tool-discovery/**"
      - "pyproject.toml"
      - ".github/workflows/provider-adoption-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # agent-skills-ppt remains absent because it cannot import python-pptx
        # under the shared install. Keep that pre-existing dependency gap
        # visible until Phase 7 reconciles its isolated requirements contract.
        experiment:
          - chapter2/context-compression
          - chapter2/kv-cache
          - chapter2/prompt-injection
          - chapter2/system-hint
          - chapter3/log-sanitization

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The chapter aggregates ch2 and ch3 pull torch, which these offline
      # tests never touch. Installing the capability groups they do use keeps
      # the job to seconds; a chapter that outgrows this set will fail on the
      # missing import rather than resolving it silently.
      - name: Install the package
        run: python -m pip install -e ".[dev,web,tokens]"

      # Declared by chapter3/log-sanitization's requirements.txt and not yet in
      # any capability group. Named here rather than widened into pyproject so
      # the CI contract stays visible until Phase 7 reconciles that file.
      - name: Install log-sanitization extras
        run: python -m pip install "ollama>=0.3.0" "pyyaml>=6.0"

      # Empty rather than unset: a resolver bug that reads a key from the
      # runner environment must fail here, not silently pass.
      - name: Run offline tests
        working-directory: ${{ matrix.experiment }}
        env:
          MOONSHOT_API_KEY: ""
          KIMI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m pytest -q

  contextual-retrieval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        working-directory: chapter3/contextual-retrieval
        run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=7.4"

      - name: Run contextual-retrieval provider tests
        working-directory: chapter3/contextual-retrieval
        env:
          SILICONFLOW_API_KEY: ""
          ARK_API_KEY: ""
          MOONSHOT_API_KEY: ""
          KIMI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          GROQ_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: >-
          python -m pytest -q
          test_provider_resolution.py
          test_client_initialization.py
          test_history_limit_zero.py

  agentic-rag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        working-directory: chapter3/agentic-rag
        run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=7.4"

      - name: Run agentic-rag provider tests
        working-directory: chapter3/agentic-rag
        env:
          SILICONFLOW_API_KEY: ""
          ARK_API_KEY: ""
          MOONSHOT_API_KEY: ""
          KIMI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          GROQ_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: >-
          python -m pytest -q
          test_provider_resolution.py
          test_client_initialization.py
          test_request_policy.py
          test_history_limit_zero.py

  agentic-rag-user-memory:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        working-directory: chapter3/agentic-rag-for-user-memory
        run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=7.4"

      # The unrestricted suite includes a live-key logging script and a live
      # retrieval-pipeline probe. Keep this provider-adoption contract offline.
      - name: Run user-memory provider tests
        working-directory: chapter3/agentic-rag-for-user-memory
        env:
          SILICONFLOW_API_KEY: ""
          DOUBAO_API_KEY: ""
          ARK_API_KEY: ""
          KIMI_API_KEY: ""
          MOONSHOT_API_KEY: ""
          KIMI_BASE_URL: ""
          OPENROUTER_API_KEY: ""
          OPENROUTER_MODEL: ""
          OPENROUTER_BASE_URL: ""
          OPENAI_API_KEY: ""
          OPENAI_BASE_URL: ""
          GROQ_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: >-
          python -m pytest -q
          test_provider_resolution.py
          test_client_initialization.py
          test_request_policy.py
          test_top_k.py

      - name: Run user-memory offline smoke test
        working-directory: chapter3/agentic-rag-for-user-memory
        env:
          SILICONFLOW_API_KEY: ""
          DOUBAO_API_KEY: ""
          ARK_API_KEY: ""
          KIMI_API_KEY: ""
          MOONSHOT_API_KEY: ""
          KIMI_BASE_URL: ""
          OPENROUTER_API_KEY: ""
          OPENROUTER_MODEL: ""
          OPENROUTER_BASE_URL: ""
          OPENAI_API_KEY: ""
          OPENAI_BASE_URL: ""
          GROQ_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: >-
          python main.py
          --mode offline-demo
          --test-id layer2_01_multiple_vehicles

  memobase:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        working-directory: chapter3/memobase
        run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=7.4"

      # test_memory.py persists a local store and is an educational manual
      # script. Keep the provider contract hermetic and side-effect free.
      - name: Run Memobase provider tests
        working-directory: chapter3/memobase
        env:
          KIMI_API_KEY: ""
          MOONSHOT_API_KEY: ""
          KIMI_BASE_URL: ""
          OPENROUTER_API_KEY: ""
          OPENROUTER_MODEL: ""
          OPENROUTER_BASE_URL: ""
        run: >-
          python -m pytest -q
          test_provider_resolution.py
          test_client_initialization.py
          test_request_policy.py

  learning-from-experience:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        working-directory: chapter1/learning-from-experience
        run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=8.3"

      - name: Run learning-from-experience provider tests
        working-directory: chapter1/learning-from-experience
        env:
          MOONSHOT_API_KEY: ""
          KIMI_API_KEY: ""
          KIMI_BASE_URL: ""
          OPENROUTER_API_KEY: ""
          OPENROUTER_BASE_URL: ""
          OPENROUTER_MODEL: ""
        run: >-
          python -m pytest -q
          tests
          test_experiment_7_2_evidence.py

  active-tool-discovery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        working-directory: chapter4/active-tool-discovery
        run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=7.4"

      - name: Run active-tool-discovery provider tests
        working-directory: chapter4/active-tool-discovery
        env:
          OPENAI_API_KEY: ""
          OPENAI_BASE_URL: ""
          OPENROUTER_API_KEY: ""
          OPENROUTER_BASE_URL: ""
          OPENROUTER_MODEL: ""
        run: python -m pytest -q test_provider_resolution.py
