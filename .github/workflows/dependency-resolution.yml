name: dependency resolution

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "chapter1/**/requirements*.txt"
      - "chapter2/**/requirements*.txt"
      - "chapter3/**/requirements*.txt"
      - "docs/DEPENDENCY_MIGRATION.md"
      - "docs/dependency-migration-ledger.toml"
      - "scripts/check_dependency_ledger.py"
      - "tests/test_dependency_ledger.py"
      - ".github/workflows/dependency-resolution.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "chapter1/**/requirements*.txt"
      - "chapter2/**/requirements*.txt"
      - "chapter3/**/requirements*.txt"
      - "docs/DEPENDENCY_MIGRATION.md"
      - "docs/dependency-migration-ledger.toml"
      - "scripts/check_dependency_ledger.py"
      - "tests/test_dependency_ledger.py"
      - ".github/workflows/dependency-resolution.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test dependency ledger checker
        run: python -m unittest tests.test_dependency_ledger

      - name: Check dependency migration ledger
        run: python scripts/check_dependency_ledger.py

  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both ends of the supported range in project.requires-python.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check lockfile freshness
        run: uv lock --check

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Check chapter extras
        shell: bash
        run: |
          for extra in ch1 ch2 ch3 ch4 ch5 ch6 ch7 ch8 ch9 ch10 all; do
            echo "::group::Python ${{ matrix.python-version }} - $extra"
            uv sync --locked --dry-run \
              --python "${{ matrix.python-version }}" \
              --extra "$extra"
            echo "::endgroup::"
          done
